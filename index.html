<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Budget Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Budget Planner</h1>
            <!-- Currency Switcher -->
            <div class="currency-container">
                <label for="currency-select">Currency: </label>
                <select id="currency-select">
                    <option value="$">USD ($)</option>
                    <option value="€">EUR (€)</option>
                    <option value="£">GBP (£)</option>
                    <option value="¥">JPY (¥)</option>
                    <option value="RM">MYR (RM)</option>
                </select>
            </div>
        </header>
        
        <!-- Dashboard Balance Cards -->
        <div class="dashboard">
            <div class="card budget">
                <h3>Monthly Budget</h3>
                <p id="total-budget"><span class="currency">$</span>0.00</p>
            </div>
            <div class="card expenses">
                <h3>Total Expenses</h3>
                <p id="total-expenses"><span class="currency">$</span>0.00</p>
            </div>
            <div class="card savings">
                <h3>Projected Savings</h3>
                <p id="net-savings"><span class="currency">$</span>0.00</p>
            </div>
        </div>

        <!-- Inputs Section -->
        <div class="grid-inputs">
            <!-- Set Initial Budget & Fixed Expenses -->
            <div class="form-container">
                <h3>1. Base Setup</h3>
                <div class="input-group">
                    <label for="monthly-budget">Monthly Budget Allocation</label>
                    <input type="number" id="monthly-budget" placeholder="e.g. 3000" value="0" step="0.01">
                </div>
                
                <form id="fixed-expense-form">
                    <label>Add Fixed Expense (Rent, Bills, etc.)</label>
                    <div class="inline-inputs">
                        <input type="text" id="fixed-desc" placeholder="Rent" required>
                        <input type="number" id="fixed-amount" placeholder="Amount" step="0.01" required>
                    </div>
                    <button type="submit">Add</button>
                </form>
            </div>

            <!-- Flexible Expenses Slider Control -->
            <div class="form-container">
                <h3>2. Flexible Expenses</h3>
                <p class="hint">Adjust your planned spending for fun, dining, shopping, etc.</p>
                <div class="slider-box">
                    <label for="flex-slider">Flexible Spending Limit:</label>
        
                    <div class="slider-display-container">
                        <span class="currency">$</span>
                        <input type="number" id="flex-manual-input" min="0" step="0.01" placeholder="0.00">
                    </div>
        
                    <input type="range" id="flex-slider" min="0" max="2000" value="0" step="1">
                    <div class="slider-range-labels">
                        <span>Min: <span class="currency">$</span>0</span>
                        <span>Max Cap: <span class="currency">$</span><span id="slider-max-text">2000</span></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- History & Breakdown Breakdown -->
        <div class="history-container">
            <h3>Fixed Expenses Breakdown</h3>
            <table>
                <thead>
                    <tr>
                        <th>Description</th>
                        <th>Type</th>
                        <th>Amount</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="transaction-list">
                    <!-- Fixed expense rows dynamically go here -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
